[package]
name = "matinee"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Scripted, reproducible demos of your software, recorded from the real thing"
license = "MIT"
publish = false

[dependencies]
color_quant = "1"
gif = "0.14"
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman"] }
toml = "1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
