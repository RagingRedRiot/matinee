# cued's status window following a release pipeline as a graph: a test that
# loops through clearing a cache, a deploy that rolls back, and a release
# that ships. Build cued first in a checkout beside this one:
# `cargo build --release -p cued -p cued-gui` in ~/cued.

[demo]
output = "cued"
size = [1200, 860]

[session]
path = ["~/cued/target/release"]

# Overlays in cued's own colors: its blue accent and slate neutrals.
[style]
accent = "#0057fc"
ripple = "#0057fc"
caption_text = "#0f172a"
caption_backing = "#ffffff"
caption_border = "#e1e5eb"

[style.dark]
accent = "#3b7bff"
ripple = "#3b7bff"
caption_text = "#e6eaf0"
caption_backing = "#151b24"
caption_border = "#263040"

[terminal]
size = 130
font_size = 15

# Other jobs, so the window looks like it does on a working machine.
[[seed]]
run = "cued every 6h -- ./steps/backup.sh > /dev/null; cued remind 45m 'stand-up' > /dev/null"

[launch]
app = "cued-gui"
wait_for = "local runs"

[[scene]]
caption = "Submit a release pipeline"
steps = [
  { hold = "1s" },
  { run = "cued submit release.toml" },
  { click = "j3 release*" },
  { click = "Graph" },
  # Frame the graph, from lint to smoke-test, while the run plays out.
  { camera = { focus = "deploy box*", zoom = 1.4 } },
  { wait_for = "j3 release, done*", timeout = "40s", hold = "0.6s" },
  # cued's success and danger colors.
  { highlight = "smoke-test box*", label = "shipped", color = "#2f8f5b", hold = "2s" },
]

[[scene]]
caption = "A hotfix that rolls back"
steps = [
  { run = "cued submit hotfix.toml" },
  { click = "j4 hotfix*" },
  { camera = { focus = "deploy box*", zoom = 1.4 } },
  { wait_for = "j4 hotfix, failed*", timeout = "30s", hold = "0.6s" },
  { highlight = "rollback box*", style = "spotlight", label = "rolled back", color = "#c93730", hold = "2.4s" },
]
