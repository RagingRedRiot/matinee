[package]
name = "matinee"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "README demos that keep up with your app"
license = "MIT"
publish = false

[dependencies]
fontdue = "0.9"
gif = { version = "0.14", default-features = false, features = ["raii_no_panic", "std"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "1"
vt100 = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman", "xwayland"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }
