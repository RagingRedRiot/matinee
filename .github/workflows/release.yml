name: Release

# Publishes the archive users download: a version tag (v0.2.0) builds matinee
# for x86_64 Linux, checks that the build performs a story in a real isolated
# session, and attaches matinee-x86_64-linux.tar.gz and its checksum to a
# GitHub release. The release notes are that version's section of
# CHANGELOG.md.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Normally the tag comes from Publish release (publish-release.yml), which
# tags a merged version bump and starts this workflow for the tag directly.
# Run against anything but a version tag, the tag check below fails.
#
# The tag must match Cargo.toml's version and point at a commit on main, so
# only code that passed CI and review is released.
#
# The asset name carries no version, so
# releases/latest/download/matinee-x86_64-linux.tar.gz always names the newest
# release. That URL skips prereleases, so releases are never marked as one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ASSET: matinee-x86_64-linux.tar.gz

jobs:
  # Read-only token: building runs every dependency's build script. Only the
  # publish job below can write, and it runs nothing from the repository.
  #
  # Built on the oldest supported runner, so the binary needs only that glibc
  # (2.35) and runs on older distributions too. It links the system's pixman
  # and xkbcommon, which the README already lists as requirements.
  build:
    name: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # main's history, for the ancestry check.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable
      - name: Tag matches Cargo.toml, is on main, and has notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "matinee") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG points at $GITHUB_SHA, which is not on main."
            exit 1
          fi
          # The section headed "## X.Y.Z" or "## X.Y.Z — date", up to the next.
          mkdir -p notes
          awk -v h="## $version" '
            /^## / { on = ($0 == h || index($0, h " — ") == 1); next }
            on' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "CHANGELOG.md has no notes under \"## $version\"."
            exit 1
          fi
          cat notes/notes.md
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpixman-1-dev libxkbcommon-dev libwayland-dev
      # No rust-cache: a clean build, with nothing restored from another run.
      - run: cargo build --release --locked
      - name: Binary links only glibc, pixman, and xkbcommon
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ldd target/release/matinee
          unexpected=$(ldd target/release/matinee | awk '{print $1}' \
            | grep -v -E '^(linux-vdso\.so\.1|/lib64/ld-linux-x86-64\.so\.2|lib(c|m|gcc_s)\.so\.[0-9]+|libpixman-1\.so\.0|libxkbcommon\.so\.0)$' || true)
          if [ -n "$unexpected" ]; then
            echo "The binary links libraries users may not have:"
            echo "$unexpected"
            exit 1
          fi
          test "$(target/release/matinee --version)" = "matinee ${TAG#v}"
      # The terminal font is compiled in, so its license travels with the binary.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p stage dist
          cp target/release/matinee LICENSE README.md assets/fonts/DejaVu-LICENSE.txt stage/
          tar -C stage -czf "dist/$ASSET" matinee LICENSE README.md DejaVu-LICENSE.txt
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
          cat "dist/$ASSET.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes/
          if-no-files-found: error

  # The archive as a user gets it, on a runner with no Rust: it must check
  # stories and perform the terminal example inside a real isolated session.
  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpixman-1-0 libxkbcommon0 dbus at-spi2-core
      - name: Allow private user namespaces on this disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The downloaded archive runs a story
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "$ASSET.sha256")
          mkdir -p "$RUNNER_TEMP/bin"
          tar -C "$RUNNER_TEMP/bin" -xzf "dist/$ASSET" matinee
          "$RUNNER_TEMP/bin/matinee" --version
          "$RUNNER_TEMP/bin/matinee" check examples/terminal/demo.toml examples/calculator/demo.toml
          "$RUNNER_TEMP/bin/matinee" run examples/terminal/demo.toml

  publish:
    name: publish
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: notes/
      # --verify-tag: publish only for the tag that triggered this run, never
      # create one. Fails if the release already exists, rather than replace
      # assets people may have verified.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --notes-file notes/notes.md
